function renderCobertura(label='Cobertura nacional'){
  currentBack=renderRoot;
  document.getElementById('backHeader').style.visibility='visible';

  const bs=[
    {label:'Hablar por WhatsApp',icon:'whatsapp',primary:true,onClick:()=>go(renderWhatsAppFlow,'Hablar por WhatsApp')},
    {label:'Volver al menú',icon:'chevronLeft',onClick:back}
  ];

  showScreen(
    userMsg(label)+
    botMsg('<b>SEPRIGUA</b> coordina servicios en los <b>22 departamentos de Guatemala</b>. Nuestra sede principal está en Ciudad de Guatemala y contamos con presencia operativa en Quetzaltenango, lo que fortalece la atención hacia occidente y la Costa Sur. Selecciona un departamento para consultar la cobertura.')+
    `<div class="coverage-card">
      <div class="coverage-head"><div><div class="coverage-kicker">Cobertura SEPRIGUA</div><div class="coverage-title">Atención en Guatemala</div></div></div>
      <div class="coverage-layout coverage-map-only">
        <div class="map-panel"><div class="map-stage map-stage-real"><div class="map-art"><img class="map-reference" src="assets/img/mapa-guatemala.png" alt="Mapa de Guatemala"><svg class="map-hit-layer" viewBox="0 0 1402 1122" preserveAspectRatio="xMidYMid meet" aria-label="Mapa interactivo de Guatemala">${MAP_PATHS}</svg><div class="coverage-tooltip" id="coverageTooltip"><div class="pin-shape">${svgIcon('map')}</div><div class="tooltip-body"><div class="tooltip-kicker">SEPRIGUA</div><div class="tooltip-name" id="tooltipName"></div><div class="tooltip-sub">Cobertura disponible</div></div></div></div></div></div>
        <div class="coverage-selection" id="coverageSelection" aria-live="polite"><div class="sel-kicker">Departamento seleccionado</div><div class="sel-title" id="coverageSelectionTitle"></div><div class="sel-copy" id="coverageSelectionCopy"></div><div class="sel-actions"><button type="button" class="btn-whatsapp" id="coverageSelWa">${svgIcon('whatsapp')} Coordinar atención</button><button type="button" class="sel-back-link" id="coverageSelBack">${svgIcon('chevronLeft')} Volver al menú</button></div></div>
      </div>
      <div class="services-bottom-nav-wrap coverage-bottom-nav">
        <div class="services-bottom-label">Servicios</div>
        <nav class="services-bottom-nav" aria-label="Navegación horizontal de servicios">
          ${SERVICIOS.map(s=>`<button type="button" class="services-bottom-tab" data-coverage-service="${s.id}">${s.nombre}</button>`).join('')}
        </nav>
      </div>
    </div>${footer(bs)}`,
    r=>{
      const stage=r.querySelector('.map-stage'),tip=r.querySelector('#coverageTooltip'),nameEl=r.querySelector('#tooltipName');
      const selection=r.querySelector('#coverageSelection'),selectionTitle=r.querySelector('#coverageSelectionTitle'),selectionCopy=r.querySelector('#coverageSelectionCopy');
      const selWa=r.querySelector('#coverageSelWa'),selBack=r.querySelector('#coverageSelBack');

      if(selWa)selWa.onclick=()=>go(renderWhatsAppFlow,'Coordinar atención');
      if(selBack)selBack.onclick=back;

      const positionTip=ev=>{
        const rect=stage.getBoundingClientRect();
        const x=ev.clientX-rect.left,y=ev.clientY-rect.top;
        tip.style.left=Math.max(4,Math.min(x,stage.clientWidth-170))+'px';
        tip.style.top=Math.max(4,Math.min(y,stage.clientHeight-60))+'px';
        tip.classList.add('show');
      };

      const selectCoverage=(btn,dept,ev)=>{
        r.querySelectorAll('.dept-hit.covered').forEach(x=>x.classList.remove('active'));
        btn.classList.add('active');

        selectionTitle.textContent=dept;
        let copy=`Sí, contamos con cobertura en <b>${dept}</b>.`;
        if(dept==='Guatemala'){
          copy+=' Nuestra sede principal y centro de operaciones se encuentra en Ciudad de Guatemala.';
        }else if(dept==='Quetzaltenango'){
          copy+=' Contamos con presencia operativa en Quetzaltenango para fortalecer la atención en occidente y la Costa Sur.';
        }else{
          copy+=' La programación se coordina según el tipo de servicio, ubicación y disponibilidad operativa.';
        }
        selectionCopy.innerHTML=copy+'<br>¿Deseas que nuestro equipo coordine tu solicitud?';
        selection.classList.add('show');
        requestAnimationFrame(()=>selection.scrollIntoView({behavior:'smooth',block:'nearest'}));

        nameEl.textContent=dept;
        positionTip(ev);
      };

      r.querySelectorAll('.services-bottom-tab[data-coverage-service]').forEach(tab=>{
        tab.addEventListener('click',()=>{
          const id=tab.dataset.coverageService;
          const svc=SERVICIOS.find(x=>x.id===id);
          if(svc){
            tab.classList.add('is-selected');
            go(()=>renderServicioDetalle(id),svc.nombre);
          }
        });
      });

      r.querySelectorAll('.dept-hit').forEach(btn=>{
        const dept=btn.dataset.dept;
        btn.classList.add('covered');
        btn.addEventListener('mouseenter',ev=>{btn.classList.add('hover');nameEl.textContent=dept;positionTip(ev)});
        btn.addEventListener('mousemove',ev=>{nameEl.textContent=dept;positionTip(ev)});
        btn.addEventListener('mouseleave',()=>{btn.classList.remove('hover');if(!btn.classList.contains('active'))tip.classList.remove('show')});
        btn.addEventListener('click',ev=>{ev.preventDefault();selectCoverage(btn,dept,ev)});
      });

      bindFooter(r,bs);
    },renderCobertura
  )
}

function renderEmergencia(label='Necesito atención'){
  currentBack=renderRoot;document.getElementById('backHeader').style.visibility='visible';
  const bs=[{label:'Hablar por WhatsApp',icon:'whatsapp',primary:true,onClick:()=>go(renderWhatsAppFlow,'Emergencia')},{label:'Volver al menú',icon:'chevronLeft',onClick:back}];
  showScreen(userMsg(label)+botMsg('<b>Si tienes una emergencia</b>, cuéntanos qué está ocurriendo, la ubicación del servicio y un número de contacto. Nuestro equipo revisará disponibilidad y prioridad para coordinar la atención. Si hay riesgo para personas, electricidad, gas o infraestructura crítica, evita intervenir sin condiciones seguras.')+`<div class="detail-card"><div class="detail-head">${iconBadge('clock')}<div><div class="detail-title">Datos que ayudan a responder más rápido</div><div class="detail-desc">Ubicación, tipo de problema, desde cuándo ocurre, fotografías o video si es seguro obtenerlos y si la operación está detenida.</div></div></div></div>${footer(bs)}`,r=>bindFooter(r,bs),renderEmergencia);
}
function renderCotizacionInfo(label='Quiero cotizar'){
  currentBack=renderRoot;document.getElementById('backHeader').style.visibility='visible';
  const bs=[{label:'Solicitar por WhatsApp',icon:'whatsapp',primary:true,onClick:()=>go(renderWhatsAppFlow,'Solicitar cotización')},{label:'Ver servicios',icon:'tools',onClick:()=>renderServiciosList('Nuestros servicios')},{label:'Volver al menú',icon:'chevronLeft',onClick:back}];
  showScreen(userMsg(label)+botMsg('Las cotizaciones se preparan según el <b>tipo de servicio, ubicación, alcance y condiciones del sitio</b>. Para orientarte mejor, indícanos qué necesitas, dónde se realizará el trabajo y, si cuentas con ellas, comparte fotografías o videos de referencia.')+`<div class="detail-card"><div class="detail-head">${iconBadge('dollar')}<div><div class="detail-title">Cotización según evaluación</div><div class="detail-desc">No todos los trabajos tienen el mismo alcance. Por eso evitamos darte un precio genérico que pueda ser incorrecto.</div></div></div></div>${footer(bs)}`,r=>bindFooter(r,bs),renderCotizacionInfo);
}
function renderGarantiaInfo(label='Garantía'){
  currentBack=renderRoot;document.getElementById('backHeader').style.visibility='visible';
  const bs=[{label:'Solicitar seguimiento',icon:'whatsapp',primary:true,onClick:()=>go(renderWhatsAppFlow,'Seguimiento de garantía')},{label:'Volver al menú',icon:'chevronLeft',onClick:back}];
  showScreen(userMsg(label)+botMsg('En SEPRIGUA damos seguimiento a nuestros trabajos. Si necesitas solicitar una <b>revisión por garantía</b>, comparte el número de orden o referencia del servicio, fecha aproximada, sede y una descripción de lo que observas. El equipo validará el caso y coordinará el seguimiento correspondiente.')+`<div class="detail-card"><div class="detail-head">${iconBadge('shield')}<div><div class="detail-title">Seguimiento profesional</div><div class="detail-desc">La revisión se gestiona con la información del servicio realizado y las condiciones actuales del sitio.</div></div></div></div>${footer(bs)}`,r=>bindFooter(r,bs),renderGarantiaInfo);
}
function renderWhatsAppFlow(label='Hablar por WhatsApp'){
  currentBack=renderRoot;document.getElementById('backHeader').style.visibility='visible';
  const bs=[{label:'Volver al menú',icon:'chevronLeft',onClick:back}];
  showScreen(
    userMsg(label)+botMsg('Nuestro equipo de trabajo te contactará lo antes posible. Para recibir atención personalizada, puedes compartir tu número de celular y una breve descripción de lo que necesitas; también puedes continuar directamente por <b>WhatsApp</b>.')+
    `<div class="wa-card"><div class="wa-title">Vamos a abrir WhatsApp</div><p>Si la app de WhatsApp está instalada en tu dispositivo, se abrirá automáticamente. Pulsa el botón para conversar directamente con nuestro equipo.</p><a href="${WHATSAPP_LINK}" target="_blank" rel="noopener" class="btn-whatsapp">${svgIcon('whatsapp')} Abrir WhatsApp</a><div class="promo-caption">Serás redirigido a WhatsApp con el enlace oficial de SEPRIGUA.</div></div><a href="${WHATSAPP_LINK}" target="_blank" rel="noopener" class="option-card link-row">${iconBadge('externalLink')}<div class="texts"><div class="title">Abrir WhatsApp manualmente</div><div class="subtitle">Haz clic aquí para continuar</div></div><div class="chev">${svgIcon('chevronRight')}</div></a><div class="wa-thanks">Te atenderemos lo antes posible. ¡Gracias por contactarnos! 😄</div>${footer(bs)}`,
    r=>bindFooter(r,bs),renderWhatsAppFlow
  )
}


/* ---------- Conversación libre: respuestas por intención y palabras clave ---------- */
function normaliza(t){return t.toLowerCase().replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u').replace(/ñ/g,'n');}
function appendChatUser(text){chatBody.insertAdjacentHTML('beforeend',userMsg(text));chatBody.scrollTop=chatBody.scrollHeight}
function appendChatBot(text){chatBody.insertAdjacentHTML('beforeend',botMsg(text));chatBody.scrollTop=chatBody.scrollHeight}
function responderLibre(texto){
  const t=normaliza(texto);
  if(/whatsapp|asesor|humano|persona|contactar|contacto|telefono|numero|llamar/.test(t)) return ['Puedo conectarte directamente con nuestro equipo. Pulsa <b>Hablar por WhatsApp</b> para continuar con una persona y coordinar tu caso.', 'wa'];
  if(/emergencia|urgente|urgencia|ahora|rebalse|desbord|inund|tapado|atascado|no drena/.test(t)) return ['Si se trata de una <b>emergencia</b>, necesito que nos indiques ubicación, qué está ocurriendo y si la operación está detenida. Nuestro equipo revisará disponibilidad y prioridad para coordinar la atención.', 'emergency'];
  if(/precio|cuanto cuesta|costo|cotiza|cotizacion|presupuesto|tarifa/.test(t)) return ['El costo depende del tipo de servicio, ubicación, alcance y condiciones del sitio. Podemos preparar una <b>cotización según evaluación</b>; comparte qué necesitas y dónde se realizará el trabajo.', 'quote'];
  if(/garantia|garantía|reclamo|revision del trabajo|seguimiento/.test(t)) return ['Sí, damos seguimiento a nuestros trabajos. Para una <b>revisión por garantía</b>, ten a mano el número de orden o referencia, fecha aproximada, sede y una descripción de lo que observas.', 'guarantee'];
  if(/horario|hora|atienden|atencion|abren|cierran|domingo|sabado/.test(t)) return ['Atendemos servicios programados y coordinamos emergencias según disponibilidad operativa. Para confirmar una hora o atención en una fecha específica, lo mejor es consultarlo directamente con nuestro equipo por WhatsApp.', 'wa'];
  if(/donde.*cobertura|que lugares.*cobertura|lugares.*cobertura|cobertura|ubicacion|donde estan|zona|departamento|sede/.test(t)) return ['Contamos con cobertura operativa en distintas zonas de Guatemala. Puedes abrir el <b>mapa de cobertura</b> para consultar los departamentos configurados y coordinar la atención según tu ubicación.', 'coverage'];
  if(/cisterna|cisternas|tanque de agua|deposito de agua/.test(t)) return ['Sí. Realizamos <b>limpieza de cisternas</b>, retirando sedimentos y suciedad acumulada, con revisión visual y recomendaciones de mantenimiento preventivo.', 'services'];
  if(/planta de tratamiento|plantas de tratamiento|aguas residuales|tratamiento de agua/.test(t)) return ['Brindamos apoyo en <b>mantenimiento y limpieza de plantas de tratamiento</b>, incluyendo extracción de lodos, limpieza de componentes accesibles y trabajos complementarios según evaluación.', 'services'];
  if(/pozo de absorcion|pozos de absorcion|pozo absorbente|absorcion/.test(t)) return ['Sí. Atendemos <b>limpieza y mantenimiento de pozos de absorción</b>, con extracción de lodos y sedimentos y evaluación de las condiciones observadas.', 'services'];
  if(/plomeria|plomero|fuga|fugas|tuberia rota|grifo|sanitario|inodoro/.test(t)) return ['También ofrecemos <b>plomería en general</b>: instalación y reparación de tuberías de PVC, CPVC y HG, llaves de paso, bajadas pluviales, conexiones y trabajos complementarios según evaluación.', 'services'];
  if(/trampa.*grasa|grasa|grasas/.test(t)) return ['Realizamos <b>limpieza y mantenimiento de trampas de grasa</b>, con extracción de residuos, limpieza del sistema y recomendaciones para prevenir obstrucciones y malos olores.', 'services'];
  if(/lodo|lodos|succion|succión|residuo|fosa septica|fosas septicas/.test(t)) return ['Contamos con servicio de <b>succión de lodos y residuos</b> para fosas, trampas, plantas y otros sistemas que requieren extracción profesional y manejo adecuado de residuos.', 'services'];
  if(/cctv|camara|cámara|inspeccion|inspección|video.*tuberia|robot/.test(t)) return ['Podemos realizar una <b>inspección interna de tuberías y drenajes</b> para localizar obstrucciones, daños y otras anomalías y así orientar la intervención adecuada.', 'services'];
  if(/drenaje|drenajes|destape|destapar|desague|desagüe|alcantarill/.test(t)) return ['Atendemos <b>destape, limpieza y mantenimiento de drenajes</b> de forma preventiva y correctiva. Si me indicas qué problema tienes, puedo orientarte mejor.', 'services'];
  if(/mantenimiento preventivo|mantenimiento programado|plan de mantenimiento|frecuencia/.test(t)) return ['Podemos estructurar <b>mantenimientos programados y personalizados</b> según el tipo de instalación, frecuencia requerida y criticidad de la operación.', 'services'];
  if(/empresa|quienes son|quienes somos|experiencia|anos|años|seprigua/.test(t)) return ['<b>SEPRIGUA</b> es una empresa guatemalteca con más de 10 años de experiencia. Atendemos mantenimiento de drenajes, cisternas, bombas de agua, biodigestores, plantas de tratamiento, plomería y otras necesidades de empresas, comercios e industrias. Nuestros servicios cuentan con seguimiento profesional y garantía según el trabajo realizado. Soy <b>Tuky</b>, su asistente virtual.', 'general'];
  if(/hotel|restaurante|industria|empresa|comercio|condominio|residencia/.test(t)) return ['Atendemos distintos tipos de instalaciones: <b>empresas, industrias, restaurantes, hoteles, comercios, edificios, condominios y residencias</b>, según el servicio y la ubicación.', 'services'];
  if(/que necesito|que datos|que informacion|como solicitar|como pido|solicitar servicio/.test(t)) return ['Para solicitar atención ayuda tener: <b>ubicación, tipo de problema o servicio, una descripción breve, fotografías o video si es posible y un número de contacto</b>. Con eso nuestro equipo puede orientarte mejor.', 'wa'];
  if(/tecnologia|equipo|equipos|hidrojet|camion|camiones|maquina|maquinas/.test(t)) return ['SEPRIGUA cuenta con los <b>recursos operativos y el personal capacitado</b> necesarios para atender cada servicio. Por política comercial, los detalles específicos de herramientas y recursos utilizados se definen únicamente durante la coordinación del trabajo.', 'general'];
  if(/restaurante|restaurantes|hotel|hoteles|centro comercial|centros comerciales|plaza|plazas|industria|industrias|empresa|empresas/.test(t)) return ['Atendemos <b>restaurantes, hoteles, centros comerciales, industrias y otras empresas</b>. Podemos coordinar mantenimientos programados, atención correctiva y emergencias según el servicio requerido.', 'services'];
  if(/biodigestor|biodigestores/.test(t)) return ['Podemos evaluar necesidades relacionadas con <b>biodigestores y sistemas de tratamiento</b>. Cuéntame qué problema presentan o qué mantenimiento necesitas y te indico cómo coordinar la atención.', 'services'];
  if(/bomba de agua|bombas de agua|bomba hidraulica|bomba hidráulica/.test(t)) return ['Atendemos trabajos relacionados con <b>bombas de agua y sistemas asociados</b> de acuerdo con la condición de la instalación. Para orientarte mejor, indícame si se trata de una falla, mantenimiento o revisión.', 'services'];
  if(/bajada pluvial|bajadas pluviales|pluvial|lluvia|rebalse|rebalses/.test(t)) return ['Atendemos <b>bajadas pluviales, áreas de rebalse y circuitos de drenaje</b>, tanto en mantenimiento programado como en atención correctiva o de emergencia.', 'services'];
  if(/quetzaltenango|xela|occidente|costa sur|costa-sur/.test(t)) return ['Contamos con <b>presencia operativa en Quetzaltenango</b>, lo que fortalece la atención hacia occidente y la Costa Sur. También coordinamos servicios en los demás departamentos de Guatemala.', 'coverage'];
  if(/guatemala capital|ciudad de guatemala|sede principal|donde estan|donde están|ubicacion|ubicación/.test(t)) return ['Nuestra <b>sede principal está en Ciudad de Guatemala</b> y contamos con presencia operativa en Quetzaltenango. Coordinamos atención en los 22 departamentos del país.', 'coverage'];
  if(/365|todo el año|todos los dias|todos los días|nacional|todo guatemala/.test(t)) return ['SEPRIGUA coordina servicios en los <b>22 departamentos de Guatemala</b>. La atención y programación se organiza según el tipo de servicio, ubicación y disponibilidad operativa.', 'coverage'];
  if(/servicio|servicios|que hacen|qué hacen|ofrecen|mantenimiento/.test(t)) return ['Ofrecemos <b>mantenimiento de drenajes, limpieza de cisternas, inspección de tuberías, succión de lodos y residuos, trampas de grasa, plantas de tratamiento, pozos de absorción, plomería y mantenimientos personalizados</b>.', 'services'];
  if(/hola|buenas|buenos|hey|saludos/.test(t)) return ['¡Hola! 👋 Soy <b>Tuky</b>, asistente virtual de SEPRIGUA. Puedo ayudarte con servicios, emergencias, cotizaciones, garantía o cobertura.', 'hello'];
  if(/gracias|perfecto|excelente|ok|vale/.test(t)) return ['¡Con gusto! Soy <b>Tuky</b>. Puedes preguntarme por servicios, una emergencia, una cotización, garantía, cobertura o cómo contactar al equipo.','general'];
  return ['Soy <b>Tuky</b> y puedo ayudarte con información sobre servicios, emergencias, cotizaciones, garantía, cobertura y contacto. Prueba preguntas como: <i>“¿Limpian cisternas?”</i>, <i>“Necesito una cotización”</i> o <i>“Tengo una emergencia de drenaje”</i>.','general'];
}




document.getElementById('chatForm').addEventListener('submit', function(ev){
  ev.preventDefault();const input=document.getElementById('chatInput');const texto=input.value.trim();if(!texto)return;input.value='';
  appendChatUser(texto);const [respuesta,tipo]=responderLibre(texto);setTimeout(()=>{
    appendChatBot(respuesta);
    if(tipo==='wa'){const q=document.createElement('div');q.className='quick-actions';q.innerHTML='<button class="btn-whatsapp">'+svgIcon('whatsapp')+' Hablar por WhatsApp</button>';chatBody.appendChild(q);q.querySelector('button').onclick=()=>renderWhatsAppFlow('Hablar por WhatsApp');}
    if(tipo==='coverage'){const q=document.createElement('div');q.className='quick-actions';q.innerHTML='<button>Ver mapa de cobertura</button>';chatBody.appendChild(q);q.querySelector('button').onclick=()=>{q.querySelector('button').classList.add('is-selected');renderCobertura('Cobertura nacional')};}
    if(tipo==='services'){const q=document.createElement('div');q.className='quick-actions';q.innerHTML='<button>Ver servicios</button>';chatBody.appendChild(q);q.querySelector('button').onclick=()=>renderServiciosList('Nuestros servicios');}
    if(tipo==='emergency'){const q=document.createElement('div');q.className='quick-actions';q.innerHTML='<button>Ver atención de emergencia</button>';chatBody.appendChild(q);q.querySelector('button').onclick=()=>renderEmergencia('Necesito atención');}
    if(tipo==='quote'){const q=document.createElement('div');q.className='quick-actions';q.innerHTML='<button>Cómo cotizar</button>';chatBody.appendChild(q);q.querySelector('button').onclick=()=>renderCotizacionInfo('Quiero cotizar');}
    if(tipo==='guarantee'){const q=document.createElement('div');q.className='quick-actions';q.innerHTML='<button>Solicitar garantía</button>';chatBody.appendChild(q);q.querySelector('button').onclick=()=>renderGarantiaInfo('Garantía');}
  },180);
});

/* ---------- Abrir / cerrar el widget ---------- */
const widget = document.getElementById('chatWidget');
const launcher = document.getElementById('launcherBtn');

function openWidget(){
  widget.classList.add('open');
  launcher.style.display = 'none';
  isOpen = true;
  renderRoot(); // siempre inicia en la pantalla raíz, sin memoria de una sesión anterior
}
function closeWidget(){
  widget.classList.remove('open');
  launcher.style.display = 'flex';
  isOpen = false;
}
launcher.onclick = openWidget;
document.getElementById('closeBtn').onclick = closeWidget;

/* El widget inicia cerrado (solo se ve el botón flotante), como cualquier
   chat de sitio web real. Si quieres que se abra solo al cargar la página,
   descomenta la siguiente línea: */
// openWidget();

</script>
<script>window.addEventListener('DOMContentLoaded',()=>document.getElementById('launcherBtn').click());</script>
<script id="seprigua-chatbot-parent-bridge">
window.addEventListener("DOMContentLoaded", () => {
  const widget = document.getElementById("chatWidget");
  const launcher = document.getElementById("launcherBtn");
  if (widget) widget.classList.add("open");
  if (launcher) launcher.style.display = "none";

  const close = document.getElementById("closeBtn");
  if (close) {
    close.onclick = () => {
      window.parent?.postMessage({ type: "SEPRIGUA_CHATBOT_CLOSE" }, "*");
    };
  }
});
</script>
